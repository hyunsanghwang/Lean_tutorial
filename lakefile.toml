name = "LeanTutorial"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanTutorial"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
# Mathlib's own style linters (copyright headers, ...) are not useful here.
# weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanTutorial"
